[package]
name = "moonson-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for the moonson load testing tool."

# The compiled program is called `moonson` even though the crate is
# `moonson-cli`. So users run `moonson ...`, not `moonson-cli ...`.
[[bin]]
name = "moonson"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
mlua = { workspace = true }
hdrhistogram = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
futures-channel = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }

[build-dependencies]
# Compiles proto/echo.proto at build time; protoc-bin-vendored ships a protoc
# binary so no system install is needed.
tonic-build = "0.12"
protoc-bin-vendored = "3"
