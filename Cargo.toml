[workspace]
resolver = "2"
members = ["crates/moonson-cli"]

# Fields shared by every crate in the workspace. Individual crates inherit
# these with `version.workspace = true`, `edition.workspace = true`, etc.
[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/dwisniewski1993/moonson"
description = "A modern, high-density load testing tool with a Luau scripting DSL."
rust-version = "1.75"

# Dependencies used by more than one crate are pinned here once, so the whole
# workspace stays on the same version. Crates opt in with
# `some_dep = { workspace = true }`. We start empty and add these in Step 1+.
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
# HTTP client for the first milestone. Default features (incl. native TLS) so it
# builds with no extra system setup on macOS. We may switch to a rustls backend
# during the density milestone (M3), where the Linux/OpenSSL story matters.
reqwest = { version = "0.12" }
# Ergonomic error handling: lets `main` return `Result<()>`, use the `?` operator,
# and attach context to errors with `.with_context(...)`.
anyhow = "1"
# Command-line argument parsing. The `derive` feature lets us describe the CLI as
# a struct with attributes instead of parsing arguments by hand.
clap = { version = "4", features = ["derive"] }
# Embeds the Luau scripting engine. `luau` compiles Luau from bundled C++ source
# (first build needs a C++ compiler; on macOS: Xcode Command Line Tools). `send`
# makes Lua values Send, which (a) lets mlua::Error convert through anyhow's `?`
# and (b) lets us move a Lua state into a spawned task per VU in Step 5. The
# `async` feature arrives in Step 4.
mlua = { version = "0.10", features = ["luau", "send"] }

# Release builds: optimise hard. A load generator spends all its time in hot
# loops, so this matters. (Has no effect on `cargo build`, only `--release`.)
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
